name: Build installers

on:
  push:
    branches: [blueprint-v1, packaging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check public model boundary
        run: node scripts/check-public-boundary.mjs
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Test engine
        working-directory: engine
        run: npm test
      - name: Build Windows NSIS and portable (x64)
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run dist:win -- --publish never
      - name: Build macOS DMGs (arm64 and x64)
        if: runner.os == 'macOS'
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never
      - name: Build Linux AppImages and debs (x64 and arm64)
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run dist:linux -- --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: OpenMeet-${{ runner.os }}-installers
          retention-days: 14
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
